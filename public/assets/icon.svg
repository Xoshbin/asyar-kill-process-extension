<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
<linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#EF4444" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Solid Flat Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#18181B" />

  <!-- Calibrated Glyph (~19% Optical Margin Sweet-Spot) -->
  <g transform="translate(-30.72 -30.72) scale(1.12)">

<g filter="url(#shadow)">
    <!-- Targeting Crosshair Outer Ring with 4 Gaps -->
    <circle cx="256" cy="256" r="130" fill="none" stroke="#EF4444" stroke-width="4" stroke-dasharray="160 44" stroke-linecap="round" filter="url(#laserGlow)"/>
    <circle cx="256" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 8"/>

    <!-- 4 Reticle Crosshair Ticks -->
    <line x1="256" y1="100" x2="256" y2="135" stroke="#EF4444" stroke-width="5" stroke-linecap="round" filter="url(#laserGlow)"/>
    <line x1="256" y1="377" x2="256" y2="412" stroke="#EF4444" stroke-width="5" stroke-linecap="round" filter="url(#laserGlow)"/>
    <line x1="100" y1="256" x2="135" y2="256" stroke="#EF4444" stroke-width="5" stroke-linecap="round" filter="url(#laserGlow)"/>
    <line x1="377" y1="256" x2="412" y2="256" stroke="#EF4444" stroke-width="5" stroke-linecap="round" filter="url(#laserGlow)"/>

    <!-- Target Microchip Core in Center -->
    <rect x="206" y="206" width="100" height="100" rx="18" fill="#FFFFFF"/>
    <!-- Chip Pins -->
    <rect x="220" y="194" width="8" height="12" rx="2" fill="#94A3B8"/>
    <rect x="240" y="194" width="8" height="12" rx="2" fill="#94A3B8"/>
    <rect x="264" y="194" width="8" height="12" rx="2" fill="#94A3B8"/>
    <rect x="284" y="194" width="8" height="12" rx="2" fill="#94A3B8"/>
    <rect x="220" y="306" width="8" height="12" rx="2" fill="#94A3B8"/>
    <rect x="240" y="306" width="8" height="12" rx="2" fill="#94A3B8"/>
    <rect x="264" y="306" width="8" height="12" rx="2" fill="#94A3B8"/>
    <rect x="284" y="306" width="8" height="12" rx="2" fill="#94A3B8"/>

    <!-- Termination Slash 'X' on the chip -->
    <line x1="228" y1="228" x2="284" y2="284" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/>
    <line x1="284" y1="228" x2="228" y2="284" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/>
  </g>
  </g>

  <!-- 2px Specular Rim Stroke -->
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2" />
</svg>